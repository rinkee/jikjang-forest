<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>LOADING</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>html,body{margin:0;height:100%;background:#2b2018;font-family:system-ui} #st{position:fixed;inset:0} #st canvas{width:100%;height:100%;display:block} #lb{position:fixed;left:8px;top:8px;color:#fff;font:14px system-ui;background:#0007;padding:4px 8px;border-radius:6px}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body><div id="st"></div><div id="lb"></div>
<script type="module">
/*
 * Dev page: one day scene with no UI.
 *   ?set=office|subway|home  ?mood=morning|day|dusk|night  ?seed=N  ?act=<activity id>
 *   ?spot=ready|table|bed (home)  ?dir=in|out (subway)  ?seat=1|0 (subway)  ?acorns=N  ?t=seconds to advance before READY
 */
import { CC } from '../js/cc.js';
import { World } from '../js/day/world.js';
import { buildOffice } from '../js/day/office.js';
for (const f of ['hair', 'face', 'clothes', 'extras']) { try { await import(`../js/parts/${f}.js`); } catch (e) {} }
const q = new URLSearchParams(location.search);
const world = new World(document.getElementById('st'), { onStatus: (s) => (document.getElementById('lb').textContent = String(s || '').replace(/\s*:[a-z]+:/g, '')) });
world.addSet('office', buildOffice(world));
try { const m = await import('../js/day/subway.js'); world.addSet('subway', m.buildSubway(world)); } catch (e) { console.warn(e); }
try { const m = await import('../js/day/home.js'); world.addSet('home', m.buildHome(world)); } catch (e) { console.warn(e); }
const s = q.get('state') ? CC.decodeState(q.get('state')) : CC.randomState(CC.rng(+(q.get('seed') || 3)));
s.name = s.name || '김숲'; s.rank = s.rank || '사원'; s.dept = s.dept || '도토리 개발팀';
await world.setLook(s);
const mood = q.get('mood') || 'day';
world.setMood(mood);
const ctx = { now: () => Date.now(), todayAcorns: +(q.get('acorns') || 230), name: s.name, rank: s.rank, dept: s.dept, overtime: mood === 'night', lunch: q.get('act') === 'lunch', act: q.get('act') || null, spot: q.get('spot') || 'table', dir: q.get('dir') || 'in', ride: 0.4, seat: q.has('seat') ? q.get('seat') === '1' : undefined };
world.show(q.get('set') || 'office', ctx);
const set = world.active;
window.world = world;
if (set.ready) { await set.ready; world.show(q.get('set') || 'office', ctx); } // the subway's passengers are made in the background
const adv = +(q.get('t') || 2);
// fast-forward so springs settle (headless frames are slow)
for (let i = 0; i < adv * 30; i++) { set.update(1 / 30, world.t += 1 / 30, world.ctx, world); world.character.tick(1 / 30); }
world.renderNow();
setTimeout(() => (document.title = 'READY'), 400);
</script></body></html>
